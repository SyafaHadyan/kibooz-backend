StylesPath = .github/vale/styles
MinAlertLevel = suggestion
# The Google style is downloaded by `vale sync` at a pinned release, only the Kibooz rules are kept in the repository
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, Kibooz
Vale.Spelling = NO
Google.EmDash = NO
Google.Parens = NO
# The prose here lists items without an Oxford comma and the rule would flag nearly every list
Google.OxfordComma = NO
# Wants a maintained vocabulary of every proper noun that can follow a colon, and these docs name tools after a colon all the time
Google.Colons = NO
