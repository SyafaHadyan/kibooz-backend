# Coverage comes from the unit and end to end tests of the CI workflow, see https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    project:
      default:
        # compare with the base commit and tolerate a small dip, so a refactor does not fail on rounding
        target: auto
        threshold: 1%
      # a hard floor of about 3 points under the coverage of 92.35 percent on 2026-10-23, so the total cannot slide down in small steps
      # that each stay inside the threshold above. Raise it when the coverage has grown and never lower it to let a pull request in.
      floor:
        target: 89%
        threshold: 0%
    patch:
      default:
        target: auto
        threshold: 5%

comment:
  layout: "condensed_header, diff, files"
  # stay quiet on pull requests that do not change coverage, such as documentation changes
  require_changes: true
