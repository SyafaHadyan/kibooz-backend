# The naming of the files of the repository, checked by the File names job of config.yaml and described in docs/ci-cd.md.
# A file name has no extension rule of its own when it has none at all, such as Dockerfile, LICENSE and CODEOWNERS.
ls:
  # a folder is lowercase words joined by hyphens, and a leading dot marks the folder of a tool
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*

  # every other file is the same, with dots for a variant such as compose.production.example.yml
  .*: kebab-case

  # a Go file is lowercase words with no separator, and only _test may follow them
  .go: regex:[a-z0-9]+(_test)?

  # the community files in capitals such as README.md and CODE_OF_CONDUCT.md are allowed next to kebab case
  .md: kebab-case | SCREAMING_SNAKE_CASE

  # a migration is a six digit number and snake case words
  internal/infra/db/migrations:
    .up.sql: regex:[0-9]{6}(_[a-z0-9]+)+
    .down.sql: regex:[0-9]{6}(_[a-z0-9]+)+

  # a workflow ends with .yaml and not .yml
  .github/workflows:
    .yml: exists:0

ignore:
  - .git
  - node_modules
  - dist
  # GitHub names the issue forms by what the person sees, and Vale names a style after its folder
  - .github/ISSUE_TEMPLATE
  - .github/vale/styles
  # made by a local run of Python and not tracked
  - "**/__pycache__"
