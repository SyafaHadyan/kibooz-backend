# An example of how a small production host can run Kibooz. It is not what the repository tests, `compose.yml` is that. It shows
# the choices that the maintainer made on one 2 vCPU host, so another operator can start from a file that is known to work and
# not from a blank page, see docs/operations.md. CI only checks that the file is still valid compose (`docker compose config`),
# so a renamed setting cannot leave it behind.
#
# What differs from compose.yml
#   - two copies of the API behind the reverse proxy of the host, each with its own port, and a rolling update that replaces them one
#     after the other (scripts/rolling-update.sh), so a deploy never leaves the site without a copy
#   - each copy is capped at half a CPU, so a flood of work cannot starve the database that shares the host
#   - PostgreSQL is not in this file. It runs as its own stack on the host and the copies join its network
#   - the image tag is always written down (IMAGE_TAG), because the update script changes it and `latest` would hide what runs
#
# Copy it to compose.yml on the host and copy .env.example to .env. In .env set IMAGE_TAG to the version to run (the file has no default
# on purpose), DB_HOST to the name of the PostgreSQL container on the network of the database stack, which has to exist before this
# file starts, and the other values that .env.example asks for.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api: &api
  # an unset IMAGE_TAG stops compose with this message and not with an invalid image name
  image: syafa/kibooz-backend:${IMAGE_TAG:?set IMAGE_TAG in .env to the version to run}
  # compose restarts a container that stopped, and it does not restart one that the image healthcheck calls unhealthy, which only shows
  # in docker ps and, through the failed metrics scrape, in the alerts, so a hung copy has to be restarted by hand
  restart: always
  # the API stops accepting requests and gives running ones 15 seconds, and then closes its push, metrics and error report work for
  # up to 17 more, so Docker has to wait longer than that
  stop_grace_period: 40s
  env_file: .env
  environment:
    REDIS_ADDRESS: redis
    REDIS_PORT: 6379
    GOMEMLIMIT: ${GOMEMLIMIT:-200MiB}
    METRICS_ADDRESS: ":9100"
  # For the push wake ups, mount the key of the Firebase service account read only and set FIREBASE_CREDENTIALS_FILE in .env to
  # /run/secrets/firebase.json. Create the file first, because Docker makes a directory of that name when it is missing, and make it
  # readable by the user of the container (65532), for example with chmod 0644.
  # volumes:
  #   - ./secrets/firebase.json:/run/secrets/firebase.json:ro
  depends_on:
    redis:
      condition: service_healthy
      required: false
  networks:
    - internal
    - postgres_postgres
  labels:
    kibooz.role: api
    kibooz.metrics_port: "9100"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        # PASSWORD_HASH_CONCURRENCY=0 gives one hash slot for each CPU except one, so a copy with half a CPU hashes one password at a
        # time. Raise that setting together with the CPU limit, because a sign in waits for a slot and is refused when none is free.
        cpus: "0.50"
        # the Grafana alert "API memory is close to its limit" fires above 300 MiB, so change that threshold when this limit changes
        memory: ${API_MEMORY_LIMIT:-384m}
  logging: *default-logging

services:
  api-1:
    <<: *api
    container_name: kibooz-api-1
    ports:
      # only the reverse proxy of this host reaches the copies, so they are never exposed on a public address by accident
      - "127.0.0.1:8000:${APP_PORT}"

  api-2:
    <<: *api
    container_name: kibooz-api-2
    ports:
      - "127.0.0.1:8001:${APP_PORT}"

  redis:
    image: redis:8-alpine
    container_name: kibooz-redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: ${REDIS_MEMORY_LIMIT:-192m}
    command:
      - sh
      - -c
      - |
        set -- --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy volatile-lru
        if [ -n "$$REDIS_USERNAME" ]; then
          set -- "$$@" --user "$$REDIS_USERNAME" on ">$$REDIS_PASSWORD" "~*" "&*" "+@all"
        fi
        exec redis-server "$$@"
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-96mb}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - kibooz-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    labels:
      kibooz.role: redis
    user: redis
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Metrics and logs go to Grafana Cloud. These two services only start with the `monitoring` profile, see docs/monitoring.md.
  alloy:
    image: grafana/alloy:v1.21.0
    container_name: kibooz-alloy
    restart: always
    profiles:
      - monitoring
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:-}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      GRAFANA_HOST: ${GRAFANA_HOST:-main}
    deploy:
      resources:
        limits:
          memory: ${ALLOY_MEMORY_LIMIT:-256m}
    volumes:
      - ./grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - kibooz-alloy:/var/lib/alloy/data
    depends_on:
      - socket-proxy
    networks:
      - internal
      - docker-api
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # The logs go to a bucket of any S3 compatible store too, where the lifecycle rule of the bucket keeps them for 90 days. It only
  # starts with the `log-archive` profile and the LOG_ARCHIVE_* settings of .env, see docs/monitoring.md.
  log-archive:
    image: timberio/vector:0.60.0-alpine
    container_name: kibooz-log-archive
    restart: always
    profiles:
      - log-archive
    command:
      - --config
      - /etc/vector/vector.yaml
    # the bucket, the address, the region and the key are in a file of their own, and not in .env, because the API containers load the whole
    # .env (x-api above) and must never hold the key of the archive. Vector refuses a missing or empty setting at the start.
    env_file:
      - path: ./logarchive/.env
        required: true
    environment:
      LOG_ARCHIVE_HOST: ${LOG_ARCHIVE_HOST:-${GRAFANA_HOST:-main}}
    deploy:
      resources:
        limits:
          memory: ${LOG_ARCHIVE_MEMORY_LIMIT:-128m}
    volumes:
      - ./logarchive/vector.yaml:/etc/vector/vector.yaml:ro
      - kibooz-log-archive:/var/lib/vector
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8686/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - socket-proxy
    networks:
      - internal
      - docker-api
    # root, because the volume of the buffer is created root owned from the image, and the read only file system, the empty capability set
    # and no-new-privileges are what limit it
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # The size of the buckets of an S3 compatible store, as metrics that Alloy scrapes and a dashboard and an alert read. It lists the objects
  # of each bucket every hour and keeps the numbers, see docs/monitoring.md. It only starts with the `bucket-sizes` profile, and its
  # settings, with a key that may list the buckets, are in a file of their own and not in .env, which every API container loads. It
  # runs the image of IMAGE_TAG, which scripts/rolling-update.sh restarts only when EXTRAS=bucket-sizes is set, so use that or run
  # `docker compose up -d bucket-sizes` after a deploy to bring it to the same version.
  bucket-sizes:
    image: syafa/kibooz-backend:${IMAGE_TAG:?set IMAGE_TAG in .env to the version to run}
    container_name: kibooz-bucket-sizes
    restart: always
    profiles:
      - bucket-sizes
    entrypoint:
      - /bucketsizes
    env_file:
      - path: ./bucketsizes/.env
        required: true
    healthcheck:
      test: ["CMD", "/bucketsizes", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      # the program holds little, and the soft limit keeps the collector away from the cap of the container
      GOMEMLIMIT: 48MiB
    deploy:
      resources:
        limits:
          memory: ${BUCKET_SIZES_MEMORY_LIMIT:-64m}
    networks:
      - internal
    labels:
      kibooz.role: bucket-sizes
      kibooz.metrics_port: "9101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # The only container that touches the Docker socket. It answers read requests for containers and networks and refuses
  # everything else, so Alloy and Vector cannot start, stop or create a container even if one of them is compromised.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: kibooz-socket-proxy
    restart: always
    profiles:
      - monitoring
      - log-archive
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      # Vector follows the start and the stop of containers through the events and asks the version and a ping, and the proxy allows all
      # three by default. They are written down so that a change of that default cannot break the archive without a trace.
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  internal:
  # no route out and shared by the socket proxy, Alloy and Vector only, so nothing else can reach the Docker API
  docker-api:
    internal: true
  # the network of the PostgreSQL stack of the host, which has to exist before this file starts
  postgres_postgres:
    external: true

volumes:
  kibooz-redis:
  kibooz-alloy:
  kibooz-log-archive:
