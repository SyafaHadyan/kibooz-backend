# Used with compose.yaml by the Performance workflow, it builds the image from the pull request
# and caps every service so a memory problem shows up as a killed container.
services:
  api:
    image: kibooz-backend:ci
    build:
      context: .
      # the Go base image of the Dockerfile is taken from the Google mirror, because Docker Hub rejects or times out many pulls from the shared runners
      # GO_IMAGE is the image the Dockerfile names, with its digest, so a new digest only has to be changed in the Dockerfile
      additional_contexts:
        - "${GO_IMAGE:?set GO_IMAGE to the Go image of the Dockerfile, see docs/testing.md}=docker-image://mirror.gcr.io/library/${GO_IMAGE}"
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # the images are named through the Google mirror because Docker Hub rejects or times out many pulls from the shared runners
  db:
    image: mirror.gcr.io/library/postgres:18-alpine
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redis:
    image: mirror.gcr.io/library/redis:8-alpine
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
