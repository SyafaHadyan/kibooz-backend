x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: syafa/kibooz-backend:${IMAGE_TAG:-latest}
    container_name: kibooz-api
    restart: always
    # the API stops accepting requests and gives running ones 10 seconds, so Docker has to wait longer than that
    stop_grace_period: 30s
    # a hard cap above GOMEMLIMIT, so a memory problem of the API kills this container and not the database next to it.
    # It is written as deploy.resources, because compose.ci.yml sets its caps there and the two keys cannot be mixed.
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-384m}
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_ADDRESS: redis
      REDIS_PORT: 6379
      GOMEMLIMIT: ${GOMEMLIMIT:-200MiB}
      # the metrics listener is on the private network only, nothing publishes this port, and Alloy scrapes it from there
      METRICS_ADDRESS: ":9100"
    ports:
      # only the reverse proxy on this host reaches the API, so it is never exposed on a public address by accident
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  db:
    image: postgres:18-alpine
    container_name: kibooz-db
    restart: always
    # a fast shutdown of PostgreSQL ends with a checkpoint, which the default 10 seconds can cut short. The database has
    # no memory limit on purpose, because it is the container that must be the last one to go when the host runs low
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # slow statements and long lock waits go to the log, where Alloy ships them. A statement that takes over half a second is
    # slow for this API, whose queries are small.
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - log_temp_files=0
    volumes:
      - kibooz-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:8-alpine
    container_name: kibooz-redis
    restart: always
    # REDIS_MAXMEMORY covers the data, the rest is the buffers and the rewrite of the append only file
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-192m}
    command:
      - sh
      - -c
      - |
        set -- --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy volatile-lru
        if [ -n "$$REDIS_USERNAME" ]; then
          set -- "$$@" --user "$$REDIS_USERNAME" on ">$$REDIS_PASSWORD" "~*" "&*" "+@all"
        fi
        exec redis-server "$$@"
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-96mb}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - kibooz-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    user: redis
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Metrics and logs go to Grafana Cloud. These two services only start with the `monitoring` profile, which is set with
  # COMPOSE_PROFILES=monitoring in .env once the GRAFANA_CLOUD_* values are filled in, see docs/monitoring.md.
  alloy:
    image: grafana/alloy:v1.21.0
    container_name: kibooz-alloy
    restart: always
    profiles:
      - monitoring
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:-}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
    deploy:
      resources:
        limits:
          memory: ${ALLOY_MEMORY_LIMIT:-256m}
    volumes:
      - ./grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - kibooz-alloy:/var/lib/alloy/data
    depends_on:
      - api
      - socket-proxy
    networks:
      - internal
      - docker-api
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # The only container that touches the Docker socket. It answers read requests for containers and refuses everything else,
  # so Alloy cannot start, stop or create a container even if it is compromised.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: kibooz-socket-proxy
    restart: always
    profiles:
      - monitoring
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  internal:
  # no route out and shared by the socket proxy and Alloy only, so nothing else can reach the Docker API
  docker-api:
    internal: true

volumes:
  kibooz-db:
  kibooz-redis:
  kibooz-alloy:
