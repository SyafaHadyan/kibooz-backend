          type: integer
        classRank:
          type: integer
        organicCount:
          type: integer
        anorganicCount:
          type: integer
    RecommendedGuidance:
      type: object
      nullable: true
      description: The guidance that fits today's mood, null while there is no mood
      required: [id, title, category, bannerUrl]
      properties:
        id:
          type: string
          description: Send this as `guidanceId` when the guidance was applied
        title:
          type: string
        category:
          type: string
        bannerUrl:
          type: string
    WaliDashboard:
      type: object
      required: [student, todayMood, pointsSummary, recommendedGuidance]
      properties:
        student:
          $ref: "#/components/schemas/WaliStudent"
        todayMood:
          $ref: "#/components/schemas/TodayMood"
        pointsSummary:
          $ref: "#/components/schemas/PointsSummary"
        recommendedGuidance:
          $ref: "#/components/schemas/RecommendedGuidance"
    WaliDashboardEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/WaliDashboard"
    ApplyGuidanceRequest:
      type: object
      required: [guidanceId, studentId]
      properties:
        guidanceId:
          type: string
          maxLength: 64
        studentId:
          type: string
          format: uuid
        parentNotes:
          type: string
          maxLength: 2000
    GuruTeacher:
      type: object
