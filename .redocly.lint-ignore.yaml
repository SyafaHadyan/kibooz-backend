# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
openapi.yaml:
  operation-4xx-response:
    - '#/paths/~1healthz/get/responses'
  # the headers of an upload request are named by HTTP, so Content-Type cannot be camel case
  rule/property-camel-case:
    - '#/components/schemas/ChatVideoUpload/properties/headers/properties/Content-Type'
    - '#/components/schemas/VideoUpload/properties/headers/properties/Content-Type'
