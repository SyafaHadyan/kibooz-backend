name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod stays on the oldest Go release the code supports because Snyk cannot read a newer go directive or a toolchain line,
          # so CI names the patch release that fixes GO-2026-6617 in the standard library. Raise it when a newer patch fixes another.
          go-version: "1.27.2"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    name: Unit and end to end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: kibooz
          POSTGRES_PASSWORD: kibooz
          POSTGRES_DB: kibooz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kibooz -d kibooz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_ENABLED: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: kibooz_test
      DB_USERNAME: kibooz
      DB_PASSWORD: kibooz
      REDIS_ADDRESS: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod stays on the oldest Go release the code supports because Snyk cannot read a newer go directive or a toolchain line,
          # so CI names the patch release that fixes GO-2026-6617 in the standard library. Raise it when a newer patch fixes another.
          go-version: "1.27.2"

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test ./... -race -count=1 -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')"
            echo "Total statement coverage is $total" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Dependabot pull requests read CODECOV_TOKEN from the Dependabot secrets. A failed upload only fails the build
      # on main, because a Codecov outage must not block a pull request.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: ${{ github.event_name == 'push' }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
