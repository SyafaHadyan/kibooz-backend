name: Config lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh actionlint)")" -color

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        # the token lets the audits that ask GitHub about the actions in use run, such as the ones for known vulnerable
        # versions and for commits that are not on the branch they claim, which are skipped without it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo "$(bash ./.github/tools/image.sh zizmor)" \
            --no-progress --format github .

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      - name: Lint Dockerfile
        run: |
          docker run --rm -i "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh hadolint)")" < Dockerfile

  dotenv:
    name: Dotenv lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The example file is grouped by topic and not sorted, so the check for the order of the keys is off. The names in the Go tags
      # of internal/infra/env/env.go are checked by tagliatelle in the Lint job.
      - name: Lint the example env file
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh dotenv-linter)")" \
            check --skip-updates --plain --ignore-checks UnorderedKey .env.example

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker compose config reads the files and builds nothing and starts nothing. The example file is not used by any other job,
      # so this is what keeps it from drifting away from the settings of the API.
      - name: Check the compose files
        env:
          IMAGE_TAG: ci
        run: |
          cp .env.example .env
          cp logarchive/archive.env.example logarchive/.env.archive
          cp bucketsizes/sizes.env.example bucketsizes/.env.sizes
          docker compose -f compose.yml config --quiet
          docker compose -f compose.production.example.yml config --quiet
          COMPOSE_PROFILES=monitoring docker compose -f compose.production.example.yml config --quiet
          COMPOSE_PROFILES=monitoring,log-archive,bucket-sizes docker compose -f compose.production.example.yml config --quiet

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # validate reads the file, compiles the remap, builds the source and the sink and checks the data directory. The checks of the
      # connections to Docker and to the bucket are skipped, because neither is there on a runner. The values only have to exist.
      - name: Validate the Vector pipeline of the log archive
        run: |
          docker run --rm -v "$PWD/logarchive:/etc/vector:ro" \
            -e LOG_ARCHIVE_BUCKET=ci -e LOG_ARCHIVE_ENDPOINT=https://example.invalid \
            -e LOG_ARCHIVE_ACCESS_KEY_ID=ci -e LOG_ARCHIVE_ACCESS_KEY_SECRET=ci \
            "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh vector)")" \
            validate --skip-healthchecks /etc/vector/vector.yaml

  names:
    name: File names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # ls-lint reads the names of the files and never opens one, the rules are in .ls-lint.yml
      - name: Check the names of the files
        env:
          # renovate: datasource=npm depName=@ls-lint/ls-lint
          version: 2.3.2
        run: npx --yes "@ls-lint/ls-lint@${version}"

  python:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # the rules are in ruff.toml, and the folder is mounted read only, so the cache of ruff is off
      - name: Check the names in the Python scripts
        run: |
          docker run --rm -v "$PWD:/io:ro" -w /io "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh ruff)")" \
            check --no-cache --output-format github .

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # every file that git tracks with the .sh ending, the settings are in .shellcheckrc and .editorconfig
      - name: ShellCheck
        run: |
          mapfile -d '' files < <(git ls-files -z '*.sh')
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh shellcheck)")" "${files[@]}"

      - name: Check the format with shfmt
        run: |
          mapfile -d '' files < <(git ls-files -z '*.sh')
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh shfmt)")" -d "${files[@]}"

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The lockfile pins every package with an integrity hash, and the install scripts are not needed for linting
      - name: Install the tools
        run: npm ci --ignore-scripts

      - name: Lint the API description
        run: npm run lint

      # Cloudflare runs the same script to publish the documentation, so a broken build is caught here before it reaches main
      - name: Build the documentation site
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/_headers
          test -s dist/favicon.ico

  renovate:
    name: Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # A broken renovate.json does not fail anything by itself, the bot just stops opening dependency pull requests. The strict
      # mode also fails on an option that was renamed or removed, which the bot would only migrate with a warning
      - name: Validate renovate.json
        env:
          # renovate: datasource=npm depName=renovate
          version: 44.174.0
        run: npx --yes --package "renovate@${version}" renovate-config-validator --strict
