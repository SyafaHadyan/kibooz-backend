name: Explain plans

# Seeds a throwaway PostgreSQL 18 on the runner with accounts, classes, chats and rows in every table, calls every method of every
# repository that reads and the jobs that run on their own, and writes the EXPLAIN plans. The database is a container of the job
# and never the one of the VPS, and nothing here touches production.
#
# A pull request that changes code that talks to the database runs it on a small seed with a time cap of a few seconds for every
# call, so a query that grows with the square of the data fails the pull request. Any other pull request ends the job at once
# with a green result, which is why the job runs on every pull request and is a required check. The full run with about 200000
# accounts is started by hand.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      classes:
        description: How many classes to seed, with 49 children each, so 4000 gives about 200000 accounts
        required: false
        default: "4000"
        type: string

concurrency:
  group: explain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  explain:
    name: Query plans
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 150 }}
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: kibooz
          POSTGRES_PASSWORD: kibooz
          POSTGRES_DB: kibooz_explain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kibooz -d kibooz_explain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the list of changed files is the difference with the base branch
          fetch-depth: 0

      # A run by hand always goes on. A pull request goes on only when it changes code that talks to the database, which is the
      # repositories, the packages with queries of their own, the migrations, the database setup and this check itself.
      - name: Find out whether the change touches the database
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pattern='^(internal/app/[^/]+/repository/|internal/(ranking|classteam|enrollment|season|sessions|filecleanup|idempotency|childremoval|classcode|explain)/|internal/infra/db/|\.github/workflows/explain\.yaml$)'

          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -E -q "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No file that talks to the database changed, so the query plans are not checked." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Seed the database and explain the queries
        if: ${{ steps.changes.outputs.run == 'true' }}
        env:
          # about 25000 accounts on a pull request, which is a minute of seeding, and the full size when started by hand
          CLASSES: ${{ inputs.classes || '500' }}
          QUERY_SECONDS: ${{ github.event_name == 'pull_request' && '10' || '180' }}
          TEST_TIMEOUT: ${{ github.event_name == 'pull_request' && '15m' || '130m' }}
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: kibooz_explain
          DB_USERNAME: kibooz
          DB_PASSWORD: kibooz
        run: |
          set -euo pipefail

          if ! [[ "$CLASSES" =~ ^[0-9]{1,5}$ ]] || [ "$CLASSES" -lt 10 ]; then
            echo "classes has to be a number from 10 to 99999" >&2
            exit 1
          fi

          export EXPLAIN_CLASSES="$CLASSES"
          export EXPLAIN_QUERY_TIMEOUT_SECONDS="$QUERY_SECONDS"
          export EXPLAIN_OUT="$RUNNER_TEMP/explain-plans.txt"

          # the summary is written even when the test failed, because the plans that exist are the point of the run
          status=0
          go test -tags explain -run TestExplainThePlansOfTheQueriesToWatch -count=1 -timeout "$TEST_TIMEOUT" -v ./internal/explain/ | tee "$RUNNER_TEMP/explain-log.txt" || status=$?

          {
            echo "### Plans of the queries to watch, $CLASSES classes"
            echo
            echo '```'
            grep -E '^(====|-- [0-9]+ rows|Execution Time|Planning Time|EXPLAIN.* failed|!! )' "$EXPLAIN_OUT" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Keep the plans
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: explain-plans
          path: |
            ${{ runner.temp }}/explain-plans.txt
            ${{ runner.temp }}/explain-log.txt
          if-no-files-found: ignore
          retention-days: 14
