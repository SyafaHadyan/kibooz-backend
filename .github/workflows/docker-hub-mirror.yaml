name: Docker Hub mirror

# Copies the image that the Docker workflow built to Docker Hub. The Docker workflow also runs for pull requests, and a pull
# request can change that workflow, so the Docker Hub token does not belong in it. The token lives in the docker-hub environment,
# which only main and version tags may use. This workflow is started by workflow_run, so GitHub always runs the copy of this
# file that is on main and a pull request cannot change it. It never checks out the repository and never runs anything from the
# pull request, it only moves an image by digest after it has checked the signature of the Docker workflow.

on:
  workflow_run:
    workflows: [Docker]
    types: [completed]

concurrency:
  # One copy at a time for each pull request, branch or tag. A copy that waits is replaced by a newer one, and a copy that has
  # started is never cancelled halfway
  group: hub-mirror-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  mirror:
    name: Copy the image to Docker Hub
    # Dependabot and fork runs are built without a push, so there is nothing to copy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docker-hub
    permissions:
      contents: read
      packages: read
      pull-requests: read
    env:
      HUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/kibooz-backend
      REPOSITORY: ${{ github.repository }}
    steps:
      # Everything below comes from fields that GitHub fills in and that a pull request cannot choose, and the tag names are built
      # from them here. The branch name is only compared, never put into a command
      - name: Work out what to copy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          echo "ghcr=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          sha7="${HEAD_SHA::7}"
          skip() { echo "::notice::$1"; echo "copy=false" >> "$GITHUB_OUTPUT"; exit 0; }
          case "$EVENT" in
            pull_request)
              [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || skip "This run has no pull request, so there is nothing to copy"
              # A newer push builds its own image and copies it, so an older build never overwrites the newer tag
              current="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
              [ "$current" = "$HEAD_SHA" ] || skip "Pull request ${PR_NUMBER} has a newer commit than ${sha7}, so its own build copies the image"
              source="sha-${sha7}"
              tags="pr-${PR_NUMBER} sha-${sha7}"
              ;;
            push | workflow_dispatch)
              if [ "$HEAD_BRANCH" = "main" ]; then
                current="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)"
                [ "$current" = "$HEAD_SHA" ] || skip "main has a newer commit than ${sha7}, so its own build copies the image"
                source="sha-${sha7}"
                tags="latest sha-${sha7}"
              elif [ "$EVENT" = "push" ] && [[ "$HEAD_BRANCH" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                # The build decides which of 1.2.3, 1.2 and 1 it sets, so only the ones that point at the same image are copied
                major="${BASH_REMATCH[1]}"
                minor="${BASH_REMATCH[2]}"
                source="${major}.${minor}.${BASH_REMATCH[3]}"
                tags="$source"
                candidates="${major}.${minor} ${major}"
              else
                skip "A run of ${EVENT} on this ref publishes nothing"
              fi
              ;;
            *)
              skip "A run of ${EVENT} publishes nothing"
              ;;
          esac
          {
            echo "copy=true"
            echo "source=${source}"
            echo "tags=${tags}"
            echo "candidates=${candidates:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.plan.outputs.copy == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: steps.plan.outputs.copy == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.plan.outputs.copy == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        if: steps.plan.outputs.copy == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The image is only copied when the signature of docker.yaml of this repository is on it, so a tag that someone moved to
      # another image in GitHub Container Registry is never copied
      - name: Find the image and check its signature
        id: image
        if: steps.plan.outputs.copy == 'true'
        env:
          GHCR_IMAGE: ${{ steps.plan.outputs.ghcr }}
          SOURCE: ${{ steps.plan.outputs.source }}
          TAGS: ${{ steps.plan.outputs.tags }}
          CANDIDATES: ${{ steps.plan.outputs.candidates }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${SOURCE}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "GitHub Container Registry holds ${digest} for ${SOURCE}"
          for candidate in $CANDIDATES; do
            other="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${candidate}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [ "$other" = "$digest" ]; then
              TAGS="${TAGS} ${candidate}"
            fi
          done
          cosign verify \
            --new-bundle-format=false \
            --certificate-identity-regexp "^https://github\.com/${REPOSITORY}/\.github/workflows/docker\.yaml@refs/(heads/main|tags/v.+|pull/[0-9]+/merge)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${GHCR_IMAGE}@${digest}" > /dev/null
          {
            echo "digest=${digest}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"

      - name: Copy the image and its signature
        if: steps.plan.outputs.copy == 'true'
        env:
          GHCR_IMAGE: ${{ steps.plan.outputs.ghcr }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          first=""
          for tag in $TAGS; do
            docker buildx imagetools create --tag "${HUB_IMAGE}:${tag}" "${GHCR_IMAGE}@${DIGEST}"
            first="${first:-$tag}"
          done
          # The signature stays the one that docker.yaml made, so the identity that the docs tell people to check does not change
          cosign copy --only=sig "${GHCR_IMAGE}@${DIGEST}" "${HUB_IMAGE}:${first}"

      - name: Verify the signature on Docker Hub
        if: steps.plan.outputs.copy == 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign verify \
            --new-bundle-format=false \
            --certificate-identity-regexp "^https://github\.com/${REPOSITORY}/\.github/workflows/docker\.yaml@refs/(heads/main|tags/v.+|pull/[0-9]+/merge)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${HUB_IMAGE}@${DIGEST}" > /dev/null
