name: Commit messages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: commits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits of the pull request are read with git log, so the whole history is needed
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit messages and the title
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The types are the ones in CONTRIBUTING.md. Only the first line is checked, because Dependabot adds a body to its commits.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          failed=0

          # Merge commits are made by GitHub or by merging main into the branch, so they are not checked
          while IFS=$'\t' read -r sha subject; do
            if ! [[ "$subject" =~ $pattern ]]; then
              echo "::error title=Commit message::${sha:0:7} does not follow Conventional Commits"
              echo "  ${sha:0:7} $subject"
              failed=1
            fi
          done < <(git log --no-merges --format='%H%x09%s' "$BASE..$HEAD")

          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error title=Pull request title::The title does not follow Conventional Commits"
            echo "  title: $TITLE"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Write each message as type(scope): summary with one of feat, fix, docs, style, refactor, perf, test, build, ci, chore or revert, as described in CONTRIBUTING.md."
            exit 1
          fi

          echo "Every commit and the title follow Conventional Commits."
