name: Commit messages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: commits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The commitlint action runs as a Docker image from Docker Hub, which limits anonymous pulls
      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # Lints the commits of the pull request. Merge commits are ignored by commitlint, and the rules are in commitlint.config.mjs.
      - name: Commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: ./commitlint.config.mjs
          helpURL: https://github.com/SyafaHadyan/kibooz-backend/blob/main/CONTRIBUTING.md

      # With merge commits the title never reaches main, so commitlint does not see it, and CONTRIBUTING.md asks for the same format
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'

          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error title=Pull request title::The title does not follow Conventional Commits"
            echo "  title: $TITLE"
            echo "Write it as type(scope): summary with one of feat, fix, docs, style, refactor, perf, test, build, ci, chore or revert, as described in CONTRIBUTING.md."
            exit 1
          fi

          echo "The title follows Conventional Commits."
