version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
