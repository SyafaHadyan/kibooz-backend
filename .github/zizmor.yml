rules:
  self-repository:
    # actionlint does not know the "$/" syntax yet and rejects it, so the jobs that call the local pull-images action keep the "./" form
    ignore:
      - commits.yaml
      - config.yaml
      - dast-active.yaml
      - dast.yaml
      - migrations.yaml
      - openapi-diff.yaml
      - perf.yaml
      - pentest-target.yaml
      - security.yaml
      - smoke-stack.yaml
